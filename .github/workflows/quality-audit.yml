name: Qualité SEO, accessibilité et navigation agentique

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "robots.txt"
      - "sitemap.xml"
      - "llms.txt"
      - "site.webmanifest"
      - "scripts/site_audit.py"
      - ".lighthouserc.json"
      - ".github/workflows/quality-audit.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "robots.txt"
      - "sitemap.xml"
      - "llms.txt"
      - "site.webmanifest"
      - "scripts/site_audit.py"
      - ".lighthouserc.json"
      - ".github/workflows/quality-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-statique:
    name: Audit HTML, SEO et actions
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Vérifier le HTML, les liens locaux, le JSON-LD et les actions
        run: python3 scripts/site_audit.py

  lighthouse:
    name: Lighthouse — accessibilité, SEO et bonnes pratiques
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer Lighthouse CI
        run: npm install --global @lhci/cli@0.14.0
      - name: Auditer les pages principales
        run: lhci autorun --config=.lighthouserc.json
      - name: Conserver les rapports Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-lighthouse
          path: lighthouse-reports
          if-no-files-found: ignore
          retention-days: 14
