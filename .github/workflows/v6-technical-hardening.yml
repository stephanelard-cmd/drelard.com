name: V6 technique — SEO, accessibilité et navigation agentique

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v6-technical-hardening.yml"

permissions:
  contents: write

jobs:
  harden-site:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Appliquer les améliorations V6 sans modifier la maquette V5
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import date
          import html as html_lib
          import json
          import re

          ROOT = Path('.')
          TODAY = '2026-08-12'

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, content):
              p = ROOT / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')

          def add_once(text, marker, addition, *, before=True):
              if addition.strip() in text:
                  return text
              if marker not in text:
                  raise RuntimeError(f'Repère introuvable: {marker[:100]}')
              return text.replace(marker, addition + marker if before else marker + addition, 1)

          def add_head_links(doc):
              extra = (
                  '<meta name="color-scheme" content="light">'
                  '<link rel="manifest" href="/site.webmanifest">'
                  '<link rel="contents" href="/plan-du-site/" title="Plan du site">'
                  '<link rel="help" href="/accessibilite/" title="Accessibilité">'
                  '<link rel="alternate" type="text/plain" href="/llms.txt" title="Résumé du site pour les agents et assistants">'
              )
              if 'href="/llms.txt"' not in doc:
                  doc = doc.replace('</head>', extra + '</head>', 1)
              return doc

          COMMON_CSS = r'''
          /* V6 technique : accessibilité, clavier et réduction des animations */
          :where(a,button,summary,[tabindex]):focus-visible{outline:3px solid #f2b84b;outline-offset:4px;border-radius:6px}
          :where(a,button,summary){touch-action:manipulation}
          .skip-link,.v6-skip{position:fixed;left:16px;top:-100px;z-index:9999;padding:12px 16px;border-radius:10px;background:#102f36;color:#fff;text-decoration:none;font-weight:850;box-shadow:0 10px 30px rgba(0,0,0,.25)}
          .skip-link:focus,.v6-skip:focus{top:16px}
          .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
          .v6-utility-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;font-size:.86rem}
          .v6-utility-links a{color:inherit;text-underline-offset:3px}
          .v6-action-link{min-height:44px;display:inline-flex;align-items:center}
          .v6-breadcrumb{padding:15px 0;border-bottom:1px solid var(--line,#dbe6e4);background:#fff}
          .v6-breadcrumb ol{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none;font-size:.86rem;color:var(--muted,#5d7278)}
          .v6-breadcrumb li+li:before{content:"/";margin-right:8px;color:#87989d}
          .v6-breadcrumb a{text-underline-offset:3px}
          @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto!important}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
          @media(forced-colors:active){:where(a,button,summary):focus-visible{outline:3px solid CanvasText}.btn{border:1px solid ButtonText}}
          '''

          # -------------------- PAGE D'ACCUEIL --------------------
          index = read('index.html')
          index = add_head_links(index)
          if '/* V6 technique' not in index:
              index = index.replace('</style>', COMMON_CSS + '</style>', 1)

          # Liens et métadonnées utiles aux agents, sans dépendre de JavaScript.
          machine_graph = {
              '@context': 'https://schema.org',
              '@graph': [
                  {
                      '@type': 'WebSite',
                      '@id': 'https://drelard.com/#agent-ready-website',
                      'url': 'https://drelard.com/',
                      'name': 'Dr Stéphane Elard — Chirurgien urologue',
                      'inLanguage': 'fr-FR',
                      'potentialAction': [
                          {
                              '@type': 'ScheduleAction',
                              'name': 'Prendre rendez-vous sur Doctolib',
                              'target': {
                                  '@type': 'EntryPoint',
                                  'urlTemplate': 'https://www.doctolib.fr/chirurgien-urologue/osny/stephane-elard',
                                  'actionPlatform': ['https://schema.org/DesktopWebPlatform','https://schema.org/MobileWebPlatform']
                              }
                          },
                          {
                              '@type': 'CommunicateAction',
                              'name': 'Appeler la consultation d’Osny',
                              'target': {'@type': 'EntryPoint', 'urlTemplate': 'tel:+33130756301'}
                          },
                          {
                              '@type': 'CommunicateAction',
                              'name': 'Appeler la consultation d’Enghien-les-Bains',
                              'target': {'@type': 'EntryPoint', 'urlTemplate': 'tel:+33139641494'}
                          }
                      ]
                  },
                  {
                      '@type': 'SiteNavigationElement',
                      'name': ['Accueil','Prises en charge','Compétences','Prolapsus génital','Parcours','Cabinets','Rendez-vous','Plan du site'],
                      'url': [
                          'https://drelard.com/',
                          'https://drelard.com/#expertises',
                          'https://drelard.com/#competences',
                          'https://drelard.com/prolapsus-genital/',
                          'https://drelard.com/#parcours',
                          'https://drelard.com/#cabinets',
                          'https://drelard.com/rendez-vous/',
                          'https://drelard.com/plan-du-site/'
                      ]
                  },
                  {
                      '@type': 'ItemList',
                      'name': 'Coordonnées et actions principales',
                      'itemListElement': [
                          {'@type':'ListItem','position':1,'name':'Consultation d’Osny — 01 30 75 63 01','url':'tel:+33130756301'},
                          {'@type':'ListItem','position':2,'name':'Consultation d’Enghien-les-Bains — 01 39 64 14 94','url':'tel:+33139641494'},
                          {'@type':'ListItem','position':3,'name':'Prendre rendez-vous','url':'https://www.doctolib.fr/chirurgien-urologue/osny/stephane-elard'},
                          {'@type':'ListItem','position':4,'name':'SOS Calcul — DUNF','url':'https://dunf.fr/sos-calcul/'}
                      ]
                  }
              ]
          }
          machine_script = '<script type="application/ld+json" id="v6-agent-actions">' + json.dumps(machine_graph, ensure_ascii=False, separators=(',',':')) + '</script>'
          if 'id="v6-agent-actions"' not in index:
              index = index.replace('</head>', machine_script + '</head>', 1)

          # Rendre les numéros des deux cabinets explicites, visibles et cliquables.
          if 'aria-label="Appeler la consultation d’Osny au 01 30 75 63 01"' not in index:
              osny_marker = '<span>Téléconsultation disponible</span><span>Parking gratuit</span>'
              osny_repl = '<span>Téléconsultation disponible</span><a class="location-phone v6-action-link" href="tel:+33130756301" aria-label="Appeler la consultation d’Osny au 01 30 75 63 01">01 30 75 63 01</a><span>Parking gratuit</span>'
              if osny_marker in index:
                  index = index.replace(osny_marker, osny_repl, 1)

          # Ajouter des liens utilitaires dans le pied de page, sans modifier l'apparence principale.
          utility = '<div class="v6-utility-links" aria-label="Liens techniques et d’aide"><a href="/rendez-vous/">Rendez-vous et contacts</a><a href="/plan-du-site/">Plan du site</a><a href="/accessibilite/">Accessibilité</a><a href="/llms.txt">Résumé texte du site</a></div>'
          if 'href="/plan-du-site/"' not in index.split('<footer',1)[-1]:
              index = index.replace('</footer>', utility + '</footer>', 1)

          # Ajouter un libellé explicite aux liens ouvrant un nouvel onglet.
          index = re.sub(r'<a([^>]*target="_blank"[^>]*)>', lambda m: '<a' + (m.group(1) if 'aria-label=' in m.group(1) else m.group(1) + ' aria-label="' + ('Ouvrir ce lien dans un nouvel onglet') + '"') + '>', index)
          write('index.html', index)

          # -------------------- PAGE PROLAPSUS --------------------
          prolapsus_path = 'prolapsus-genital/index.html'
          prolapsus = read(prolapsus_path)
          prolapsus = add_head_links(prolapsus)
          if '/* V6 technique' not in prolapsus:
              prolapsus = prolapsus.replace('</style>', COMMON_CSS + '</style>', 1)
          if '<a class="v6-skip" href="#main">' not in prolapsus:
              prolapsus = prolapsus.replace('<body>', '<body><a class="v6-skip" href="#main">Aller au contenu principal</a>', 1)
          if '<main>' in prolapsus:
              prolapsus = prolapsus.replace('<main>', '<main id="main">', 1)
          if 'class="v6-breadcrumb"' not in prolapsus:
              crumb = '<nav class="v6-breadcrumb" aria-label="Fil d’Ariane"><div class="container"><ol><li><a href="/">Accueil</a></li><li aria-current="page">Prolapsus génital</li></ol></div></nav>'
              prolapsus = prolapsus.replace('<main id="main">', '<main id="main">' + crumb, 1)
          if 'href="/plan-du-site/"' not in prolapsus.split('<footer',1)[-1]:
              prolapsus = prolapsus.replace('</footer>', utility + '</footer>', 1)

          # Générer un FAQPage uniquement à partir des questions et réponses réellement visibles.
          faq_entities = []
          for question, answer in re.findall(r'<details[^>]*>\s*<summary>(.*?)</summary>\s*<div[^>]*>(.*?)</div>\s*</details>', prolapsus, flags=re.S|re.I):
              q = re.sub(r'<[^>]+>', ' ', question)
              a = re.sub(r'<[^>]+>', ' ', answer)
              q = re.sub(r'\s+', ' ', html_lib.unescape(q)).strip()
              a = re.sub(r'\s+', ' ', html_lib.unescape(a)).strip()
              if q and a:
                  faq_entities.append({'@type':'Question','name':q,'acceptedAnswer':{'@type':'Answer','text':a}})
          if faq_entities and 'id="v6-faq-schema"' not in prolapsus:
              faq = {'@context':'https://schema.org','@type':'FAQPage','@id':'https://drelard.com/prolapsus-genital/#faq','mainEntity':faq_entities[:8]}
              prolapsus = prolapsus.replace('</head>', '<script type="application/ld+json" id="v6-faq-schema">' + json.dumps(faq, ensure_ascii=False, separators=(',',':')) + '</script></head>', 1)

          page_actions = {
              '@context':'https://schema.org',
              '@type':'MedicalWebPage',
              '@id':'https://drelard.com/prolapsus-genital/#agent-actions',
              'url':'https://drelard.com/prolapsus-genital/',
              'about':{'@type':'MedicalCondition','name':'Prolapsus génital','alternateName':'Descente d’organes'},
              'potentialAction':[
                  {'@type':'ScheduleAction','name':'Prendre rendez-vous','target':'https://www.doctolib.fr/chirurgien-urologue/osny/stephane-elard'},
                  {'@type':'CommunicateAction','name':'Appeler Enghien-les-Bains','target':'tel:+33139641494'},
                  {'@type':'CommunicateAction','name':'Appeler Osny','target':'tel:+33130756301'}
              ]
          }
          if 'id="v6-prolapsus-actions"' not in prolapsus:
              prolapsus = prolapsus.replace('</head>', '<script type="application/ld+json" id="v6-prolapsus-actions">' + json.dumps(page_actions, ensure_ascii=False, separators=(',',':')) + '</script></head>', 1)
          prolapsus = re.sub(r'<a([^>]*target="_blank"[^>]*)>', lambda m: '<a' + (m.group(1) if 'aria-label=' in m.group(1) else m.group(1) + ' aria-label="Ouvrir ce lien dans un nouvel onglet"') + '>', prolapsus)
          write(prolapsus_path, prolapsus)

          # -------------------- PAGES UTILES --------------------
          BASE_STYLE = '''
          :root{--ink:#17323a;--muted:#5d7278;--brand:#0b4d5b;--brand2:#126d78;--soft:#eef6f4;--line:#dbe6e4;--paper:#fff;--max:960px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);line-height:1.65;background:var(--paper)}a{color:var(--brand);text-underline-offset:3px}.container{width:min(calc(100% - 32px),var(--max));margin:auto}.top{border-bottom:1px solid var(--line);background:#fff}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{text-decoration:none;color:var(--ink);font-weight:900}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 19px;border-radius:999px;background:var(--brand);color:#fff;text-decoration:none;font-weight:850}.hero{padding:72px 0 52px;background:linear-gradient(180deg,#fbfdfc,var(--soft))}h1{font-size:clamp(2.35rem,6vw,4.2rem);line-height:1.08;letter-spacing:-.04em;margin:0}.lead{font-size:1.08rem;color:var(--muted);max-width:760px}.section{padding:60px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{padding:24px;border:1px solid var(--line);border-radius:22px;background:#fff}.card h2,.card h3{margin-top:0}.actions{display:flex;flex-wrap:wrap;gap:10px}.action{display:inline-flex;align-items:center;min-height:46px;padding:0 16px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-weight:800}.notice{padding:20px;border-left:4px solid #c99e61;background:#fffaf1;border-radius:12px}.breadcrumb{padding:14px 0;border-bottom:1px solid var(--line)}.breadcrumb ol{display:flex;gap:8px;list-style:none;padding:0;margin:0;font-size:.86rem}.breadcrumb li+li:before{content:"/";margin-right:8px}.footer{padding:38px 0;background:#102f36;color:#dce9ea}.footer a{color:#fff}.skip{position:fixed;left:16px;top:-90px;z-index:99;padding:11px 15px;background:#102f36;color:#fff;border-radius:9px}.skip:focus{top:16px}:focus-visible{outline:3px solid #f2b84b;outline-offset:4px}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}@media(max-width:680px){.grid{grid-template-columns:1fr}}
          '''

          def page_shell(title, description, path, body, schema=None):
              canonical = 'https://drelard.com' + path
              schema_block = '' if not schema else '<script type="application/ld+json">' + json.dumps(schema, ensure_ascii=False, separators=(',',':')) + '</script>'
              return f'''<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b4d5b"><meta name="color-scheme" content="light"><title>{title}</title><meta name="description" content="{description}"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="{canonical}"><link rel="manifest" href="/site.webmanifest"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="alternate" type="text/plain" href="/llms.txt" title="Résumé du site pour les agents"><style>{BASE_STYLE}</style>{schema_block}</head><body><a class="skip" href="#main">Aller au contenu principal</a><header class="top"><div class="container nav"><a class="brand" href="/">Dr Stéphane Elard · Chirurgien urologue</a><a class="btn" href="/rendez-vous/">Rendez-vous</a></div></header><nav class="breadcrumb" aria-label="Fil d’Ariane"><div class="container"><ol><li><a href="/">Accueil</a></li><li aria-current="page">{title.split('|')[0].strip()}</li></ol></div></nav><main id="main">{body}</main><footer class="footer"><div class="container"><p><strong>Dr Stéphane Elard</strong> · Osny : <a href="tel:+33130756301">01 30 75 63 01</a> · Enghien : <a href="tel:+33139641494">01 39 64 14 94</a></p><p><a href="/plan-du-site/">Plan du site</a> · <a href="/accessibilite/">Accessibilité</a> · <a href="/llms.txt">Résumé texte</a></p></div></footer></body></html>'''

          rendezvous_body = '''<section class="hero"><div class="container"><h1>Rendez-vous et contacts</h1><p class="lead">Choisissez l’action correspondant à votre besoin. Aucun renseignement médical confidentiel ne doit être transmis par une messagerie non sécurisée.</p></div></section><section class="section"><div class="container grid"><article class="card"><h2>Osny — CHP Sainte-Marie</h2><p>1 rue Christian Barnard, 95520 Osny</p><div class="actions"><a class="action" href="tel:+33130756301">Appeler Osny : 01 30 75 63 01</a><a class="action" href="https://www.doctolib.fr/chirurgien-urologue/osny/stephane-elard" target="_blank" rel="noopener noreferrer">Prendre rendez-vous sur Doctolib</a></div><p>Examens urodynamiques, cystoscopie ambulatoire et téléconsultation disponibles selon indication.</p></article><article class="card"><h2>Enghien-les-Bains</h2><p>8 rue de Malleville, 95880 Enghien-les-Bains</p><div class="actions"><a class="action" href="tel:+33139641494">Appeler Enghien : 01 39 64 14 94</a><a class="action" href="https://www.doctolib.fr/chirurgien-urologue/osny/stephane-elard" target="_blank" rel="noopener noreferrer">Prendre rendez-vous sur Doctolib</a></div><p>Consultation sur rendez-vous et téléconsultation disponible.</p></article><article class="card"><h2>SOS Calcul — DUNF</h2><p>Accès au dispositif d’orientation pour une suspicion de calcul urinaire ou de colique néphrétique.</p><a class="action" href="https://dunf.fr/sos-calcul/" target="_blank" rel="noopener noreferrer">Accéder à SOS Calcul</a></article><aside class="notice" role="note"><h2>Urgence médicale</h2><p>En cas d’impossibilité complète d’uriner, douleur testiculaire brutale, douleur lombaire avec fièvre, saignement important ou autre urgence, appelez le 15 ou le 112.</p></aside></div></section>'''
          rendezvous_schema = {'@context':'https://schema.org','@type':'ContactPage','name':'Rendez-vous et contacts — Dr Stéphane Elard','url':'https://drelard.com/rendez-vous/','mainEntity':{'@type':'Physician','@id':'https://drelard.com/#dr-stephane-elard'},'potentialAction':[{'@type':'ScheduleAction','target':'https://www.doctolib.fr/chirurgien-urologue/osny/stephane-elard'},{'@type':'CommunicateAction','target':'tel:+33130756301'},{'@type':'CommunicateAction','target':'tel:+33139641494'}]}
          write('rendez-vous/index.html', page_shell('Rendez-vous et contacts | Dr Stéphane Elard','Téléphones des consultations d’Osny et d’Enghien-les-Bains, accès Doctolib, téléconsultation et SOS Calcul.','/rendez-vous/',rendezvous_body,rendezvous_schema))

          sitemap_body = '''<section class="hero"><div class="container"><h1>Plan du site</h1><p class="lead">Accès direct aux informations médicales, aux lieux de consultation et aux actions principales.</p></div></section><section class="section"><div class="container grid"><nav class="card" aria-labelledby="pages-title"><h2 id="pages-title">Pages principales</h2><ul><li><a href="/">Accueil et urologie générale</a></li><li><a href="/prolapsus-genital/">Prolapsus génital et descente d’organes</a></li><li><a href="/rendez-vous/">Rendez-vous et contacts</a></li><li><a href="/accessibilite/">Accessibilité</a></li></ul></nav><nav class="card" aria-labelledby="sections-title"><h2 id="sections-title">Rubriques de l’accueil</h2><ul><li><a href="/#expertises">Prises en charge</a></li><li><a href="/#competences">Compétences distinctives</a></li><li><a href="/#comprendre">Informations médicales</a></li><li><a href="/#parcours">Parcours</a></li><li><a href="/#cabinets">Cabinets</a></li><li><a href="/#politique-editoriale">Politique éditoriale</a></li></ul></nav><nav class="card" aria-labelledby="actions-title"><h2 id="actions-title">Actions</h2><ul><li><a href="tel:+33130756301">Appeler Osny : 01 30 75 63 01</a></li><li><a href="tel:+33139641494">Appeler Enghien : 01 39 64 14 94</a></li><li><a href="https://www.doctolib.fr/chirurgien-urologue/osny/stephane-elard">Prendre rendez-vous sur Doctolib</a></li><li><a href="https://dunf.fr/sos-calcul/">SOS Calcul — DUNF</a></li></ul></nav><article class="card"><h2>Version texte pour assistants</h2><p>Le fichier <a href="/llms.txt">llms.txt</a> résume les pages, les coordonnées et les limites d’usage du site dans un format simple à parcourir.</p></article></div></section>'''
          write('plan-du-site/index.html', page_shell('Plan du site | Dr Stéphane Elard','Plan HTML des pages médicales, consultations, coordonnées et services du site drelard.com.','/plan-du-site/',sitemap_body,{'@context':'https://schema.org','@type':'CollectionPage','name':'Plan du site','url':'https://drelard.com/plan-du-site/'}))

          accessibility_body = '''<section class="hero"><div class="container"><h1>Accessibilité</h1><p class="lead">Le site vise une utilisation simple au clavier, avec lecteur d’écran, sur mobile et avec agrandissement du texte.</p></div></section><section class="section"><div class="container grid"><article class="card"><h2>Démarche</h2><p>La maquette conserve une structure HTML sémantique, un lien d’évitement, des intitulés de liens explicites, un focus visible, des zones tactiles suffisantes et une prise en compte de la réduction des animations.</p></article><article class="card"><h2>État actuel</h2><p>Des contrôles automatisés SEO et accessibilité sont exécutés à chaque modification. Une vérification automatique ne suffit toutefois pas à déclarer une conformité complète aux WCAG 2.2 AA ; des tests manuels complémentaires restent nécessaires.</p></article><article class="card"><h2>Signaler une difficulté</h2><p>Vous pouvez signaler un problème d’accès au contenu en appelant la consultation d’Osny au <a href="tel:+33130756301">01 30 75 63 01</a> ou celle d’Enghien-les-Bains au <a href="tel:+33139641494">01 39 64 14 94</a>.</p></article><article class="card"><h2>Alternatives disponibles</h2><p>Le <a href="/plan-du-site/">plan du site</a> et le <a href="/llms.txt">résumé texte</a> fournissent des chemins d’accès simplifiés aux informations essentielles.</p></article></div></section>'''
          write('accessibilite/index.html', page_shell('Accessibilité | Dr Stéphane Elard','Démarche d’accessibilité du site drelard.com, navigation clavier, lecteurs d’écran et signalement des difficultés.','/accessibilite/',accessibility_body,{'@context':'https://schema.org','@type':'WebPage','name':'Accessibilité','url':'https://drelard.com/accessibilite/'}))

          not_found = '''<section class="hero"><div class="container"><h1>Page introuvable</h1><p class="lead">L’adresse demandée n’existe pas ou a changé.</p><div class="actions"><a class="action" href="/">Retour à l’accueil</a><a class="action" href="/plan-du-site/">Consulter le plan du site</a><a class="action" href="/rendez-vous/">Rendez-vous et contacts</a></div></div></section>'''
          write('404.html', page_shell('Page introuvable | Dr Stéphane Elard','La page demandée est introuvable. Accédez à l’accueil, au plan du site ou aux coordonnées.','/404.html',not_found))

          manifest = {
              'name':'Dr Stéphane Elard — Chirurgien urologue',
              'short_name':'Dr Elard',
              'description':'Site professionnel d’information en urologie et andrologie.',
              'lang':'fr-FR',
              'start_url':'/',
              'scope':'/',
              'display':'standalone',
              'background_color':'#ffffff',
              'theme_color':'#0b4d5b',
              'icons':[{'src':'/assets/apple-touch-icon.png','sizes':'180x180','type':'image/png','purpose':'any maskable'}]
          }
          write('site.webmanifest', json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          llms = '''# drelard.com — Dr Stéphane Elard

> Site professionnel d'information médicale en urologie et andrologie. Les contenus ne remplacent pas une consultation et ne doivent pas être utilisés pour une urgence.

## Identité
