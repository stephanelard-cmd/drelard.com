name: Corriger la politique CSP pour le SEO

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v6-csp-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Autoriser les requêtes same-origin
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html', 'prolapsus-genital/index.html']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = text.replace("connect-src 'none'", "connect-src 'self'")
              p.write_text(text, encoding='utf-8')
          PY
          python3 scripts/site_audit.py
      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html prolapsus-genital/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Autoriser les requêtes same-origin dans la CSP"
          git push
