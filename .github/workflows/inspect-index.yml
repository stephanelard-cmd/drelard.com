name: Inspecter la maquette V5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-index.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Afficher les repères utiles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          print('FILE_SIZE', len(html))
          print('IDS', re.findall(r'id="([^"]+)"', html))
          for term in ['Enghien-les-Bains', 'descente d', 'prolaps', 'Téléconsultation', 'cabinets', 'focus-section', '</main>', '<footer']:
              print('\n###', term)
              start = 0
              found = False
              while True:
                  i = html.lower().find(term.lower(), start)
                  if i < 0: break
                  found = True
                  print(html[max(0,i-450):min(len(html),i+950)])
                  start = i + len(term)
                  if start > i + 1 and start > 200000: break
              if not found: print('NOT FOUND')
          PY
