name: Finaliser la V6 technique

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v6-polish.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Corriger les derniers points Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def update(path, kind):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text = text.replace('href="https://drelard.com/favicon.svg"', 'href="/favicon.svg"')
              text = text.replace('href="https://drelard.com/assets/apple-touch-icon.png"', 'href="/assets/apple-touch-icon.png"')
              text = text.replace('; upgrade-insecure-requests', '')
              text = text.replace(' upgrade-insecure-requests', '')

              if kind == 'home' and '/* V6 contraste renforcé */' not in text:
                  css = '/* V6 contraste renforcé */.path-card .step{color:#fff}.path-card p{color:#f4fbfc}'
                  text = text.replace('</style>', css + '</style>', 1)
              if kind == 'prolapsus' and '/* V6 contraste partage */' not in text:
                  css = '/* V6 contraste partage */.share p{color:#4e646a}'
                  text = text.replace('</style>', css + '</style>', 1)
              p.write_text(text, encoding='utf-8')

          update('index.html', 'home')
          update('prolapsus-genital/index.html', 'prolapsus')
          PY
          python3 scripts/site_audit.py

      - name: Publier les corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html prolapsus-genital/index.html
          if git diff --cached --quiet; then
            echo "Aucune correction nécessaire."
            exit 0
          fi
          git commit -m "Améliorer les contrastes et la compatibilité Lighthouse"
          git push
