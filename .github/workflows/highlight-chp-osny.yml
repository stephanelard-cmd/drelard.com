name: Valoriser CHP Sainte-Marie Osny

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/highlight-chp-osny.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mettre en avant le CHP Sainte-Marie et les liens officiels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          clinic = 'https://chpsaintemarie.vivalto-sante.com/'
          practitioner = 'https://chpsaintemarie.vivalto-sante.com/praticien/dr-elard-stephane/'

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
            '<div class="quick-item"><strong>Osny — CHP Sainte-Marie</strong><span>1 rue Christian Barnard · 01 30 75 63 01</span></div>',
            '<div class="quick-item"><strong>Osny — CHP Sainte-Marie</strong><span>Lieu principal de consultation et plateau technique · 1 rue Christian Barnard · 01 30 75 63 01</span></div>'
          )

          old = '<article class="location"><p class="eyebrow">Osny</p><h3>CHP Sainte-Marie</h3><address>1 rue Christian Barnard<br>95520 Osny</address><div class="meta"><span>Examens urodynamiques</span><span>Cystoscopie ambulatoire</span><span>SOS Calcul</span><span>Chirurgie</span></div><div class="location-links"><a class="text-link" href="tel:+33130756301">01 30 75 63 01</a><a class="text-link" href="https://www.doctolib.fr/chirurgien-urologue/osny/stephane-elard" target="_blank" rel="noopener noreferrer">Doctolib</a><a class="text-link" href="https://dunf.fr/sos-calcul/" target="_blank" rel="noopener noreferrer">SOS Calcul</a></div></article>'
          new = '<article class="location"><p class="eyebrow">Osny · Site principal</p><h3>CHP Sainte-Marie — lieu principal de consultation et plateau technique</h3><address>1 rue Christian Barnard<br>95520 Osny</address><p style="color:var(--muted);margin:10px 0 2px">Le CHP Sainte-Marie d’Osny est le lieu principal d’exercice du Dr Stéphane Elard et le site de son activité médico-chirurgicale. Il y réalise les consultations et actes nécessitant le plateau technique, notamment chirurgie, endoscopie, cystoscopie ambulatoire et examens urodynamiques selon indication.</p><div class="meta"><span>Lieu principal d’exercice</span><span>Plateau technique</span><span>Examens urodynamiques</span><span>Cystoscopie ambulatoire</span><span>SOS Calcul</span><span>Chirurgie urologique</span></div><div class="location-links"><a class="text-link" href="tel:+33130756301">01 30 75 63 01</a><a class="text-link" href="https://www.doctolib.fr/chirurgien-urologue/osny/stephane-elard" target="_blank" rel="noopener noreferrer">Doctolib</a><a class="text-link" href="'+clinic+'" target="_blank" rel="noopener noreferrer">Site officiel du CHP Sainte-Marie</a><a class="text-link" href="'+practitioner+'" target="_blank" rel="noopener noreferrer">Fiche du Dr Elard au CHP</a><a class="text-link" href="https://dunf.fr/sos-calcul/" target="_blank" rel="noopener noreferrer">SOS Calcul</a></div></article>'
          if old not in s:
              raise SystemExit('Bloc Osny attendu introuvable dans index.html')
          s = s.replace(old, new)

          s = s.replace(
            '"description":"Consultations d’urologie et d’andrologie, examens urodynamiques et cystoscopies en ambulatoire au CHP Sainte-Marie d’Osny.",',
            '"description":"Lieu principal de consultation et plateau technique du Dr Stéphane Elard : urologie, andrologie, chirurgie urologique, examens urodynamiques et cystoscopies ambulatoires au CHP Sainte-Marie d’Osny.",'
          )
          s = s.replace(
            '"employee":{"@id":"https://drelard.com/#dr-stephane-elard"},\n        "areaServed":{"@type":"AdministrativeArea","name":"Val-d’Oise"}\n      }',
            '"employee":{"@id":"https://drelard.com/#dr-stephane-elard"},\n        "parentOrganization":{"@type":"Hospital","name":"CHP Sainte-Marie","url":"'+clinic+'"},\n        "sameAs":["'+practitioner+'","'+clinic+'"],\n        "areaServed":{"@type":"AdministrativeArea","name":"Val-d’Oise"}\n      }'
          )
          s = s.replace(
            '<a href="#cabinets">Osny — CHP Sainte-Marie</a><a href="tel:+33130756301">Osny : 01 30 75 63 01</a>',
            '<a href="'+clinic+'" target="_blank" rel="noopener noreferrer">Osny — CHP Sainte-Marie · site principal</a><a href="tel:+33130756301">Osny : 01 30 75 63 01</a>'
          )
          p.write_text(s, encoding='utf-8')

          r = Path('rendez-vous/index.html')
          x = r.read_text(encoding='utf-8')
          x = x.replace(
            '<article class="card"><h2>Osny — CHP Sainte-Marie</h2><p>1 rue Christian Barnard, 95520 Osny</p>',
            '<article class="card"><h2>Osny — CHP Sainte-Marie · site principal</h2><p><strong>Lieu principal de consultation et plateau technique du Dr Stéphane Elard.</strong><br>1 rue Christian Barnard, 95520 Osny</p>'
          )
          x = x.replace(
            '<p>Examens urodynamiques, cystoscopie ambulatoire et téléconsultation disponibles selon indication.</p></article>',
            '<p>Examens urodynamiques, cystoscopie ambulatoire, chirurgie urologique et accès au plateau technique selon indication.</p><div class="actions"><a class="action" href="'+clinic+'" target="_blank" rel="noopener noreferrer">Site officiel du CHP Sainte-Marie</a><a class="action" href="'+practitioner+'" target="_blank" rel="noopener noreferrer">Fiche officielle du Dr Elard au CHP</a></div></article>'
          )
          r.write_text(x, encoding='utf-8')

          l = Path('llms.txt')
          t = l.read_text(encoding='utf-8')
          t = t.replace(
            '- Osny — CHP Sainte-Marie, 1 rue Christian Barnard, 95520 Osny : +33 1 30 75 63 01',
            '- Osny — CHP Sainte-Marie, 1 rue Christian Barnard, 95520 Osny : +33 1 30 75 63 01 — lieu principal de consultation et plateau technique du Dr Stéphane Elard — site officiel : '+clinic+' — fiche praticien : '+practitioner
          )
          t = t.replace('2026-08-12', '2026-08-17')
          l.write_text(t, encoding='utf-8')
          PY
      - name: Commit et publication
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html rendez-vous/index.html llms.txt
          if git diff --cached --quiet; then
            echo "Aucune modification à publier"
            exit 0
          fi
          git commit -m "Mettre en avant le CHP Sainte-Marie d'Osny"
          git push
