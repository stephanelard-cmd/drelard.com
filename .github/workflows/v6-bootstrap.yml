name: Appliquer la V6 technique

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v6-bootstrap.yml"

permissions:
  contents: write

jobs:
  apply-v6:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraire et vérifier le script V6
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/v6-technical-hardening.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Publier la V6 technique"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          script = '\n'.join(lines) + '\n'

          script = script.replace(
              "write('scripts/site_audit.py', re.sub(r'^          ', '', audit, flags=re.M))",
              "write('scripts/site_audit.py', audit)",
          )
          script = script.replace(
              "write('.github/workflows/quality-audit.yml', re.sub(r'^          ', '', quality_workflow, flags=re.M))",
              "write('.github/workflows/quality-audit.yml', quality_workflow)",
          )

          target = Path('scripts/apply_v6.py')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(script, encoding='utf-8')
          PY
          python -m py_compile scripts/apply_v6.py

      - name: Appliquer les améliorations
        run: python scripts/apply_v6.py

      - name: Publier les fichiers du site
        shell: bash
        run: |
          set -euo pipefail

          # Le jeton GitHub Actions n'a pas le droit de modifier des workflows.
          # Les workflows seront nettoyés et ajoutés séparément par l'application GitHub.
          git restore --source=HEAD --staged --worktree .github/workflows
          rm -f .github/workflows/quality-audit.yml
          rm -rf scripts/__pycache__

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
            exit 0
          fi
          git commit -m "V6 technique : SEO, accessibilité et navigation agentique"
          git push
