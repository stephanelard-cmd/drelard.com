name: Corriger image accueil centrée

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-hero-image.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Utiliser la photo centrée pour la page d'accueil
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          candidates = [
              '/assets/dr-stephane-elard-social-1200x900.jpg?v=20260813-hd',
              '/assets/dr-stephane-elard-hero-20260813.jpg',
              '/assets/dr-stephane-elard-cabinet.webp?v=20260812-v5',
              '/assets/dr-stephane-elard-cabinet.jpg',
              '/assets/dr-stephane-elard-cabinet.webp',
          ]
          new = '/assets/dr-stephane-elard-cabinet-centre.jpg?v=20260814-center'
          changed = False
          for old in candidates:
              if old in s:
                  s = s.replace(old, new)
                  changed = True
          s2 = s.replace('object-position: 50% 32%;', 'object-position: 50% 18%;', 1)
          if s2 != s:
              changed = True
              s = s2
          if changed:
              p.write_text(s, encoding='utf-8')
              print('Photo d’accueil centrée et cache actualisé')
          else:
              print('Aucune modification nécessaire')
          PY
      - name: Commit si nécessaire
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Aucune modification à publier"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Centrer la photo d’accueil"
          git push
