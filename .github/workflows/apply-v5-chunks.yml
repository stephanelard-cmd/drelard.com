name: Appliquer la maquette V5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-v5-chunks.yml"

permissions:
  contents: write

jobs:
  apply-v5:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Reconstruire index.html V5
        shell: bash
        run: |
          set -euo pipefail
          cat .restore-v5/index.b64.part* > /tmp/index.html.gz.b64
          base64 -d /tmp/index.html.gz.b64 | gzip -d > index.html
          touch .nojekyll
          grep -q "Téléconsultation disponible" index.html
          grep -q "https://dunf.fr/sos-calcul/" index.html
          grep -q "monogram" index.html
          grep -q "Prises en charge" index.html

      - name: Publier V5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
            exit 0
          fi
          git commit -m "Restaurer la maquette V5 et ajouter la téléconsultation à Osny"
          git push
