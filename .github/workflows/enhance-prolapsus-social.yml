name: Mettre en avant le prolapsus et les réseaux sociaux

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enhance-prolapsus-social.yml"

permissions:
  contents: write

jobs:
  enhance-site:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Pillow
        run: python -m pip install --quiet pillow

      - name: Modifier la maquette V5 et générer les visuels sociaux
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageFile
          import re, os

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          root = Path('.')
          path = root / 'index.html'
          html = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global html
              if old not in html:
                  raise SystemExit(f'Repère introuvable pour {label}: {old[:120]}')
              html = html.replace(old, new, 1)

          def sub_once(pattern, repl, label):
              global html
              html, count = re.subn(pattern, repl, html, count=1)
              if count != 1:
                  raise SystemExit(f'Remplacement regex impossible pour {label}: {count}')

          # Métadonnées de référencement et de partage social.
          sub_once(r'<meta name="description" content="[^"]*">', '<meta name="description" content="Dr Stéphane Elard, chirurgien urologue à Osny et Enghien-les-Bains : expertise du prolapsus génital, cœlioscopie urogynécologique, robotique, andrologie et urologie générale.">', 'meta description')
          sub_once(r'<meta property="og:title" content="[^"]*">', '<meta property="og:title" content="Dr Stéphane Elard — Expertise du prolapsus génital et urologie">', 'og title')
          sub_once(r'<meta property="og:description" content="[^"]*">', '<meta property="og:description" content="Prolapsus génital, descente d’organes, cœlioscopie urogynécologique et chirurgie robot-assistée selon l’indication, à Osny et Enghien-les-Bains.">', 'og description')
          sub_once(r'<meta property="og:image:alt" content="[^"]*">', '<meta property="og:image:alt" content="Dr Stéphane Elard — expertise du prolapsus génital, de la cœlioscopie urogynécologique et de la chirurgie robotique">', 'og image alt')
          sub_once(r'<meta name="twitter:title" content="[^"]*">', '<meta name="twitter:title" content="Dr Stéphane Elard — Expertise du prolapsus génital">', 'twitter title')
          sub_once(r'<meta name="twitter:description" content="[^"]*">', '<meta name="twitter:description" content="Bilan et traitement du prolapsus génital, cœlioscopie urogynécologique et assistance robotique selon l’indication.">', 'twitter description')

          # Téléphone spécifique du cabinet d’Enghien dans les données structurées.
          replace_once('"telephone": "+33130756301", "description": "Consultations d’urologie générale et d’andrologie à Enghien-les-Bains."', '"telephone": "+33139641494", "description": "Consultations d’urologie générale, d’andrologie et d’urologie féminine à Enghien-les-Bains, avec expertise du prolapsus génital."', 'téléphone JSON-LD Enghien')
          html = html.replace('"Descente d’organes", "Calculs urinaires"', '"Prolapsus génital (descente d’organes)", "Promontofixation cœlioscopique", "Calculs urinaires"')

          # Navigation et éléments immédiatement visibles.
          replace_once('<a href="#parcours">Parcours</a><a href="#cabinets">Cabinets</a>', '<a href="#parcours">Parcours</a><a href="/prolapsus-genital/">Prolapsus</a><a href="#cabinets">Cabinets</a>', 'navigation prolapsus')
          replace_once('avec une pratique avancée de la chirurgie cœlioscopique et robotique ainsi que du traitement de la descente d’organes.', 'avec une expertise particulièrement développée dans le bilan et le traitement du prolapsus génital (descente d’organes), notamment par cœlioscopie urogynécologique ou assistance robotique lorsque l’indication le justifie.', 'texte hero')
          replace_once('Robotique et descente d’organes', 'Prolapsus génital · cœlioscopie · robotique', 'pastille hero')
          replace_once('<strong>Chirurgie mini-invasive</strong><span>Endoscopie, laser, cœlioscopie, robotique et descente d’organes</span>', '<strong>Expertise du prolapsus génital</strong><span>Bilan, voie vaginale, cœlioscopie urogynécologique et assistance robotique selon l’indication</span>', 'bandeau rapide')

          # Cartes d’expertise.
          replace_once('<h3>Urologie féminine et descente d’organes</h3><p>Incontinence d’effort ou par urgenturie, hyperactivité vésicale, infections récidivantes, troubles de la vidange et prise en charge de la descente d’organes.</p>', '<h3>Prolapsus génital et urologie féminine</h3><p>Incontinence, hyperactivité vésicale, troubles de la vidange et expertise du prolapsus génital, du bilan fonctionnel aux options conservatrices ou chirurgicales.</p><a class="card-link" href="/prolapsus-genital/">Découvrir la prise en charge spécialisée</a>', 'carte prolapsus')
          replace_once('<h2>Andrologie, cœlioscopie urogynécologique, robotique et descente d’organes</h2>', '<h2>Prolapsus génital, cœlioscopie urogynécologique, robotique et andrologie</h2>', 'titre compétences')
          replace_once('Des diplômes spécialisés et une pratique chirurgicale mini-invasive permettent d’envisager une prise en charge complète, du bilan fonctionnel à l’intervention lorsqu’elle est indiquée.', 'Le DIU de cœlioscopie urogynécologique et une pratique chirurgicale mini-invasive avancée permettent une prise en charge du prolapsus génital, du bilan fonctionnel à l’intervention lorsqu’elle est indiquée.', 'introduction compétences')
          replace_once('<h3>Traitement de la descente d’organes</h3><p>Le bilan prend en compte la gêne, les symptômes urinaires, digestifs et sexuels. Les options conservatrices ou chirurgicales sont discutées, par voie vaginale ou cœlioscopique selon la situation.</p>', '<h3>Traitement du prolapsus génital</h3><p>Le bilan prend en compte la gêne et les symptômes urinaires, digestifs ou sexuels. Rééducation, pessaire, voie vaginale, promontofixation cœlioscopique ou assistance robotique sont discutés selon la situation.</p><a class="focus-link" href="/prolapsus-genital/">Voir la page dédiée au prolapsus génital</a>', 'carte compétences prolapsus')
          replace_once('<summary>Descente d’organes</summary>', '<summary>Prolapsus génital (descente d’organes)</summary>', 'accordéon médical')

          # Téléphone visible et cliquable à Enghien.
          old_enghien = '<div class="location-meta"><span>Consultation sur rendez-vous</span><span>Téléconsultation disponible</span></div><div class="location-links"><button class="text-link copy-address" type="button" data-copy="8 rue de Malleville, 95880 Enghien-les-Bains" aria-label="Copier l’adresse du cabinet à Enghien-les-Bains">Copier l’adresse</button><a class="text-link" href="https://www.doctolib.fr/chirurgien-urologue/osny/stephane-elard" target="_blank" rel="noopener noreferrer">Prendre rendez-vous</a></div>'
          new_enghien = '<div class="location-meta"><span>Consultation sur rendez-vous</span><span>Téléconsultation disponible</span><a class="location-phone" href="tel:+33139641494" aria-label="Appeler le cabinet d’Enghien-les-Bains au 01 39 64 14 94">01 39 64 14 94</a></div><div class="location-links"><button class="text-link copy-address" type="button" data-copy="8 rue de Malleville, 95880 Enghien-les-Bains" aria-label="Copier l’adresse du cabinet à Enghien-les-Bains">Copier l’adresse</button><a class="text-link" href="tel:+33139641494">Appeler le cabinet</a><a class="text-link" href="https://www.doctolib.fr/chirurgien-urologue/osny/stephane-elard" target="_blank" rel="noopener noreferrer">Prendre rendez-vous</a></div>'
          replace_once(old_enghien, new_enghien, 'carte Enghien')
          replace_once('<a href="#cabinets">Osny — CHP Sainte-Marie</a><a href="#cabinets">Enghien-les-Bains</a><a href="tel:+33130756301">01 30 75 63 01</a>', '<a href="#cabinets">Osny — CHP Sainte-Marie</a><a href="tel:+33130756301">Osny : 01 30 75 63 01</a><a href="#cabinets">Enghien-les-Bains</a><a href="tel:+33139641494">Enghien : 01 39 64 14 94</a>', 'téléphones footer')

          # Bloc de mise en avant et boutons de partage social.
          spotlight = '''<section class="section prolapse-spotlight" id="prolapsus-expertise"><div class="container spotlight-grid"><div><p class="eyebrow">Expertise mise en avant</p><h2>Prolapsus génital : du bilan à la chirurgie mini-invasive</h2><p class="lead">La descente d’organes peut associer gêne pelvienne, troubles urinaires, digestifs ou sexuels. Le Dr Stéphane Elard propose une évaluation individualisée et discute les traitements conservateurs ou chirurgicaux, notamment la promontofixation cœlioscopique ou robot-assistée lorsqu’elle est indiquée.</p><ul class="spotlight-list"><li>DIU de cœlioscopie urogynécologique</li><li>Bilan des symptômes urinaires et urodynamique selon indication</li><li>Rééducation, pessaire, voie vaginale ou abdominale</li><li>Décision partagée selon l’anatomie et les attentes de la patiente</li></ul><div class="spotlight-actions"><a class="btn btn-primary" href="/prolapsus-genital/">Consulter la page spécialisée</a><a class="btn btn-secondary" href="https://www.doctolib.fr/chirurgien-urologue/osny/stephane-elard" target="_blank" rel="noopener noreferrer">Prendre rendez-vous</a></div></div><aside class="social-share"><span class="social-badge">Information médicale validée</span><h3>Partager cette expertise</h3><p>Une page dédiée et un visuel adapté permettent un partage propre sur les principaux réseaux, sans note ni témoignage de patient.</p><div class="share-row"><a class="share-btn" href="https://www.linkedin.com/sharing/share-offsite/?url=https%3A%2F%2Fdrelard.com%2Fprolapsus-genital%2F" target="_blank" rel="noopener noreferrer">LinkedIn</a><a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u=https%3A%2F%2Fdrelard.com%2Fprolapsus-genital%2F" target="_blank" rel="noopener noreferrer">Facebook</a><a class="share-btn" href="https://wa.me/?text=Prolapsus%20g%C3%A9nital%20%3A%20informations%20du%20Dr%20St%C3%A9phane%20Elard%20https%3A%2F%2Fdrelard.com%2Fprolapsus-genital%2F" target="_blank" rel="noopener noreferrer">WhatsApp</a></div></aside></div></section>'''
          marker = '<section class="section section-soft" id="comprendre">'
          if marker not in html:
              raise SystemExit('Repère de section comprendre introuvable')
          html = html.replace(marker, spotlight + marker, 1)

          extra_css = '''
          .card-link,.focus-link{display:inline-flex;margin-top:18px;font-weight:800;text-decoration:none}.card-link{color:var(--brand)}.focus-link{color:#f0d19f}.location-phone{display:inline-flex;align-items:center;min-height:32px;padding:0 11px;border-radius:999px;background:var(--brand);color:white;text-decoration:none;font-weight:850}.prolapse-spotlight{background:linear-gradient(180deg,#f9fcfb,#eef6f4)}.spotlight-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:42px;align-items:center}.spotlight-list{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin:24px 0;padding-left:20px;color:var(--muted)}.spotlight-actions{display:flex;flex-wrap:wrap;gap:12px}.social-share{padding:30px;border-radius:28px;background:white;border:1px solid var(--line);box-shadow:var(--shadow)}.social-badge{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:.77rem;font-weight:850;text-transform:uppercase;letter-spacing:.06em}.social-share h3{margin-top:17px;font-size:1.45rem}.social-share p{margin-top:10px;color:var(--muted)}.share-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.share-btn{display:inline-flex;align-items:center;min-height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--line);color:var(--brand);text-decoration:none;font-size:.86rem;font-weight:850}.share-btn:hover{background:var(--brand-soft)}@media(max-width:900px){.spotlight-grid{grid-template-columns:1fr}.spotlight-list{grid-template-columns:1fr}}@media(max-width:580px){.spotlight-list{padding-left:18px}}
          '''
          if '</style>' not in html:
              raise SystemExit('Balise style fermante introuvable')
          html = html.replace('</style>', extra_css + '</style>', 1)

          # Ajouter la page dédiée aux liens du pied de page.
          replace_once('<a href="#competences">Compétences distinctives</a><a href="#comprendre">Informations médicales</a>', '<a href="#competences">Compétences distinctives</a><a href="/prolapsus-genital/">Prolapsus génital</a><a href="#comprendre">Informations médicales</a>', 'lien footer prolapsus')

          path.write_text(html, encoding='utf-8')

          # Génération de visuels sociaux réels à partir du portrait fourni.
          assets = root / 'assets'
          assets.mkdir(exist_ok=True)
          source = assets / 'dr-stephane-elard-cabinet.jpg'
          if not source.exists():
              source = assets / 'dr-stephane-elard-cabinet.webp'
          photo = Image.open(source).convert('RGB')
          brand=(11,77,91); brand2=(18,109,120); gold=(201,158,97)
          font_bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          font_reg='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'

          def cover(im,size,focus=.16):
              W,H=size; iw,ih=im.size; scale=max(W/iw,H/ih)
              r=im.resize((int(iw*scale),int(ih*scale)),Image.Resampling.LANCZOS)
              left=max(0,(r.width-W)//2); top=max(0,min(r.height-H,int((r.height-H)*focus)))
              return r.crop((left,top,left+W,top+H))

          def gradient(size,c1,c2):
              W,H=size; im=Image.new('RGB',size); px=im.load()
              for x in range(W):
                  t=x/max(1,W-1); c=tuple(int(c1[i]*(1-t)+c2[i]*t) for i in range(3))
                  for y in range(H): px[x,y]=c
              return im

          def rounded_mask(size,radius):
              m=Image.new('L',size,0); d=ImageDraw.Draw(m); d.rounded_rectangle((0,0,size[0]-1,size[1]-1),radius=radius,fill=255); return m

          def wrap(draw,text,font,max_width):
              lines=[]; current=''
              for word in text.split():
                  test=(current+' '+word).strip()
                  if draw.textbbox((0,0),test,font=font)[2] <= max_width: current=test
                  else:
                      if current: lines.append(current)
                      current=word
              if current: lines.append(current)
              return lines

          def social_card(size,title_lines,subtitle,outfile,square=False):
              W,H=size; base=gradient(size,(7,48,57),(15,98,109)).convert('RGBA')
              pW=int(W*(.40 if not square else .43)); pH=int(H*.86); px=W-pW-int(W*.055); py=(H-pH)//2
              crop=cover(photo,(pW,pH))
              shadow=Image.new('RGBA',size,(0,0,0,0)); sd=ImageDraw.Draw(shadow); sd.rounded_rectangle((px+10,py+16,px+pW+10,py+pH+16),radius=48,fill=(0,0,0,75)); shadow=shadow.filter(ImageFilter.GaussianBlur(14)); base=Image.alpha_composite(base,shadow)
              panel=Image.new('RGBA',size,(0,0,0,0)); panel.paste(crop.convert('RGBA'),(px,py),rounded_mask((pW,pH),46)); base=Image.alpha_composite(base,panel)
              d=ImageDraw.Draw(base); badge=86 if H>=800 else 70; bx=int(W*.055); by=int(H*.09)
              d.rounded_rectangle((bx,by,bx+badge,by+badge),radius=22,fill=gold)
              fb=ImageFont.truetype(font_bold,int(badge*.42)); bb=d.textbbox((0,0),'SE',font=fb); d.text((bx+(badge-(bb[2]-bb[0]))/2,by+(badge-(bb[3]-bb[1]))/2-4),'SE',font=fb,fill='white')
              x=bx; y=by+badge+int(H*.06); maxw=px-x-int(W*.04); small=ImageFont.truetype(font_bold,28 if H>=800 else 22); d.text((x,y),'DR STÉPHANE ELARD',font=small,fill=(216,235,236)); y+=int(H*.07)
              ft=ImageFont.truetype(font_bold,60 if H>=800 else 48)
              for line in title_lines: d.text((x,y),line,font=ft,fill='white'); y+=ft.size+8
              y+=10; fs=ImageFont.truetype(font_reg,29 if H>=800 else 22)
              for line in wrap(d,subtitle,fs,maxw): d.text((x,y),line,font=fs,fill=(218,234,235)); y+=fs.size+8
              fy=H-int(H*.10); d.line((x,fy,px-int(W*.04),fy),fill=(255,255,255,75),width=2); ff=ImageFont.truetype(font_bold,23 if H>=800 else 19); d.text((x,fy+15),'drelard.com  •  Osny & Enghien-les-Bains',font=ff,fill=(242,247,246))
              base.convert('RGB').save(outfile,quality=91,optimize=True,progressive=True)

          social_card((1200,630),['UROLOGIE','ANDROLOGIE'],'Chirurgie robotique, cœlioscopie urogynécologique et expertise du prolapsus génital.',assets/'dr-stephane-elard-social-1200x630.jpg')
          social_card((1200,900),['UNE EXPERTISE','UROLOGIQUE'],'De la consultation à la chirurgie mini-invasive.',assets/'dr-stephane-elard-social-1200x900.jpg')
          social_card((1200,1200),['DR STÉPHANE','ELARD'],'Chirurgien urologue • Andrologue diplômé',assets/'dr-stephane-elard-social-1200x1200.jpg',True)
          social_card((1200,630),['PROLAPSUS GÉNITAL','DESCENTE D’ORGANES'],'Bilan individualisé • Cœlioscopie urogynécologique • Chirurgie robot-assistée selon l’indication',assets/'prolapsus-genital-dr-elard-1200x630.jpg')

          icon=gradient((180,180),(7,48,57),(18,109,120)); di=ImageDraw.Draw(icon); di.rounded_rectangle((18,18,162,162),radius=42,outline=gold,width=7); fi=ImageFont.truetype(font_bold,68); bb=di.textbbox((0,0),'SE',font=fi); di.text(((180-(bb[2]-bb[0]))/2,(180-(bb[3]-bb[1]))/2-7),'SE',font=fi,fill='white'); icon.save(assets/'apple-touch-icon.png',optimize=True)
          (root/'favicon.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#082f38"/><stop offset="1" stop-color="#126d78"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#g)"/><rect x="6" y="6" width="52" height="52" rx="15" fill="none" stroke="#c99e61" stroke-width="3"/><text x="32" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">SE</text></svg>''',encoding='utf-8')

          # Sitemap enrichi avec la page spécialisée et les images sociales.
          (root/'sitemap.xml').write_text('''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9" xmlns:image="http://www.google.com/schemas/sitemap-image/1.1">
            <url><loc>https://drelard.com/</loc><lastmod>2026-08-12</lastmod><changefreq>monthly</changefreq><priority>1.0</priority><image:image><image:loc>https://drelard.com/assets/dr-stephane-elard-social-1200x630.jpg</image:loc></image:image></url>
            <url><loc>https://drelard.com/prolapsus-genital/</loc><lastmod>2026-08-12</lastmod><changefreq>monthly</changefreq><priority>0.9</priority><image:image><image:loc>https://drelard.com/assets/prolapsus-genital-dr-elard-1200x630.jpg</image:loc></image:image></url>
          </urlset>
          ''',encoding='utf-8')

          # Contrôles simples avant publication.
          checks = [
              ('01 39 64 14 94', html),
              ('/prolapsus-genital/', html),
              ('Prolapsus génital', html),
              ('linkedin.com/sharing/share-offsite', html),
          ]
          for needle, haystack in checks:
              if needle not in haystack: raise SystemExit(f'Contrôle manquant: {needle}')
          for asset in ['dr-stephane-elard-social-1200x630.jpg','dr-stephane-elard-social-1200x900.jpg','dr-stephane-elard-social-1200x1200.jpg','prolapsus-genital-dr-elard-1200x630.jpg','apple-touch-icon.png']:
              if not (assets/asset).exists() or (assets/asset).stat().st_size < 1000: raise SystemExit(f'Visuel invalide: {asset}')

          # Nettoyage du contrôle temporaire et de ce workflow à usage unique.
          (root/'.github/workflows/inspect-index.yml').unlink(missing_ok=True)
          (root/'.github/workflows/enhance-prolapsus-social.yml').unlink(missing_ok=True)
          PY

      - name: Publier les améliorations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ajouter le téléphone d’Enghien et renforcer l’expertise du prolapsus"
          git push
