name: Déployer dieppeoratoriens.com et synchroniser les calendriers

on:
  push:
    branches: [main]
  schedule:
    # Toutes les 15 minutes, décalé du début d’heure pour limiter les retards de file GitHub.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dieppeoratoriens-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstituer et contrôler le site source
        run: |
          cat package/site.zip.b64.* | base64 --decode > site.zip
          echo "3dff4f59f82c1c1ae1b1b8407ab7b276703526f5ae008ea6c496a74ad7dd7e52  site.zip" | sha256sum -c -
          mkdir -p source
          unzip -q site.zip -d source

      - name: Installer les dépendances de construction
        run: python -m pip install --disable-pip-version-check beautifulsoup4 pillow

      - name: Appliquer les corrections issues des documents ADTER
        run: python automation/patch_site.py source

      - name: Contrôler les scripts
        run: python -m py_compile automation/patch_site.py automation/build_calendar.py

      - name: Construire le site statique
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude='.github/' \
            --exclude='scripts/' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='README.md' \
            --exclude='SOURCES.md' \
            source/ _site/

      - name: Synchroniser Booking.com et Airbnb
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          OUTPUT: _site/assets/data/availability.json
        run: python automation/build_calendar.py

      - name: Optimiser les photographies
        run: |
          if [ -f source/scripts/fetch_photos.py ]; then
            (cd source && SITE_ROOT="$GITHUB_WORKSPACE/_site" python scripts/fetch_photos.py)
          fi

      - name: Vérifier la confidentialité des flux iCal
        run: |
          ! grep -R --line-number --fixed-strings 'ical.booking.com' _site
          ! grep -R --line-number --fixed-strings 'calendar/ical/' _site

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléverser le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
