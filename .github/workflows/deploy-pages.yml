name: Deploy dieppeoratoriens.com

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Reassemble and verify site package
        run: |
          cat package/site.zip.b64.* | base64 --decode > site.zip
          echo "3dff4f59f82c1c1ae1b1b8407ab7b276703526f5ae008ea6c496a74ad7dd7e52  site.zip" | sha256sum -c -
          mkdir -p source
          unzip -q site.zip -d source

      - name: Synchronize Booking.com and Airbnb calendars
        env:
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
        run: python source/scripts/sync_calendars.py

      - name: Test calendar parser
        run: python -m unittest discover -s source/tests -p "test_*.py"

      - name: Build static site
        run: |
          mkdir -p _site
          rsync -a source/ _site/ \
            --exclude ".github/" \
            --exclude "scripts/" \
            --exclude "tests/" \
            --exclude "docs/" \
            --exclude "README.md" \
            --exclude "SOURCES.md"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
