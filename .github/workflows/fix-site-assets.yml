name: Corriger les photos et le lien SOS Calcul

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-site-assets.yml"

permissions:
  contents: write

jobs:
  fix-site:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Corriger la page publiée
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          # Utiliser des fichiers WebP vérifiés et contourner l'ancien cache.
          html = html.replace(
              "/assets/dr-stephane-elard-cabinet.jpg",
              "/assets/dr-stephane-elard-cabinet.webp?v=20260812-2",
          )
          html = html.replace(
              "/assets/dr-stephane-elard-portrait.jpg",
              "/assets/dr-stephane-elard-portrait.webp?v=20260812-2",
          )

          # Rendre SOS Calcul visible et directement accessible, dans le même onglet.
          html = html.replace(
              '<a href="#cabinets">Cabinets</a>',
              '<a href="#cabinets">Cabinets</a><a href="https://dunf.fr/sos-calcul/" rel="external">SOS Calcul</a>',
          )
          html = html.replace(
              '<a class="btn secondary" href="#cabinets">Lieux d’exercice</a>',
              '<a class="btn secondary" href="#cabinets">Lieux d’exercice</a><a class="btn secondary" href="https://dunf.fr/sos-calcul/" rel="external">SOS Calcul — accès direct</a>',
          )
          html = html.replace(
              '<span class="tag">SOS Calcul (DUNF)</span>',
              '<a class="tag" href="https://dunf.fr/sos-calcul/" rel="external">SOS Calcul (DUNF)</a>',
          )
          html = html.replace(
              '.tag{padding:',
              '.tag{display:inline-flex;text-decoration:none;padding:',
          )

          path.write_text(html, encoding="utf-8")
          PY

      - name: Enregistrer la correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Aucune modification nécessaire."
            exit 0
          fi
          git commit -m "Corriger les photos et rendre SOS Calcul accessible"
          git push
